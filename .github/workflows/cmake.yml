mkdir -p .github/workflows
cat > .github/workflows/cmake.yml << 'EOF'
name: CMake Build and Test

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build_cmake
        working-directory: labs/lab1

      - name: Build project
        run: cmake --build build_cmake
        working-directory: labs/lab1

      - name: Run tests
        run: ctest --test-dir build_cmake --output-on-failure
        working-directory: labs/lab1

      - name: Build library only
        run: cmake --build build_cmake --target lab1lib
        working-directory: labs/lab1
EOF